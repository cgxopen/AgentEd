<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentEd</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="menubar">
        <div class="header-left">
          <button id="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="menu-dropdown">&#9776;</button>
          <span id="filename" title="Untitled">Untitled</span>
          <span id="modified-indicator" class="hidden">*</span>
        </div>
        <div class="header-right">
          <div id="header-indicators">
            <span id="token-number" class="indicator indicator-primary" title="– tokens">–</span>
            <span id="token-unit" class="indicator indicator-collapse-600">tokens</span>
            <span id="word-count" class="indicator indicator-secondary indicator-collapse-800">– words</span>
            <span id="char-count" class="indicator indicator-secondary indicator-collapse-1000">– characters</span>
            <button id="spellcheck-toggle" type="button" class="indicator spellcheck-toggle spellcheck-off" title="Click to enable spell-check for this session">Spell: off</button>
            <button id="indicator-search" type="button" class="indicator indicator-search indicator-collapse-800" title="Find (Ctrl+F)" aria-label="Find" aria-expanded="false" aria-controls="search-panel">
              <svg class="indicator-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" />
                <path d="m13.5 13.5-3.2-3.2" />
              </svg>
            </button>
            <span id="badge-metadata" class="indicator document-badge indicator-collapse-600" style="display:none" aria-hidden="true"></span>
            <button id="badge-images" type="button" class="indicator document-badge indicator-collapse-600" style="display:none" aria-hidden="true" aria-expanded="false" aria-controls="assets-popover"></button>
            <button id="cluster-indicator" type="button" class="indicator cluster-indicator indicator-collapse-600" style="display:none" aria-hidden="true" aria-expanded="false" aria-controls="cluster-popover"></button>
          </div>
          <button id="overflow-toggle" class="indicator-overflow" aria-label="More indicators" aria-expanded="false" aria-controls="overflow-popover" title="Hover any indicator for details">...</button>
          <button id="appearance-menu-trigger" type="button" class="appearance-menu-trigger" aria-label="Appearance settings" aria-expanded="false" aria-controls="appearance-popover" title="Appearance">&#8942;</button>
        </div>
        <nav id="menu-dropdown" class="hidden">
          <button id="menu-section-file" class="menu-section" aria-expanded="false" aria-controls="menu-panel-file">File <span class="menu-chevron" aria-hidden="true">&#8250;</span></button>
          <div id="menu-panel-file" class="menu-panel" role="group" aria-label="File" hidden>
            <button id="menu-new">New</button>
            <button id="menu-new-from-template">New from Template…</button>
            <button id="menu-open">Open</button>
            <button id="menu-save">Save</button>
            <button id="menu-save-as">Save As</button>
            <button id="menu-close">Close file</button>
          </div>
          <button id="menu-section-edit" class="menu-section" aria-expanded="false" aria-controls="menu-panel-edit">Edit <span class="menu-chevron" aria-hidden="true">&#8250;</span></button>
          <div id="menu-panel-edit" class="menu-panel" role="group" aria-label="Edit" hidden>
            <button id="menu-find">Find <span class="menu-shortcut">Ctrl+F</span></button>
            <button id="menu-replace">Replace <span class="menu-shortcut">Ctrl+H</span></button>
            <button id="menu-find-next">Find Next <span class="menu-shortcut">F3</span></button>
            <button id="menu-find-prev">Find Previous <span class="menu-shortcut">Shift+F3</span></button>
            <button id="menu-undo">Undo <span class="menu-shortcut">Ctrl+Z</span></button>
            <button id="menu-redo">Redo <span class="menu-shortcut">Ctrl+Y</span></button>
          </div>
          <button id="menu-section-insert" class="menu-section" aria-expanded="false" aria-controls="menu-panel-insert">Insert <span class="menu-chevron" aria-hidden="true">&#8250;</span></button>
          <div id="menu-panel-insert" class="menu-panel" role="group" aria-label="Insert" hidden>
            <button id="menu-insert-table">Insert Table</button>
            <button id="menu-insert-media">Insert Media</button>
            <button id="menu-insert-code-block">Insert Code Block <span class="menu-shortcut">Ctrl+Shift+K</span></button>
            <button id="menu-insert-checklist">Insert Checklist</button>
            <button id="menu-insert-horizontal-rule">Insert Horizontal Rule</button>
            <button id="menu-insert-metadata">Insert Metadata</button>
            <button id="menu-insert-emoji">Insert Emoji</button>
          </div>
          <button id="menu-section-view" class="menu-section" aria-expanded="false" aria-controls="menu-panel-view">View <span class="menu-chevron" aria-hidden="true">&#8250;</span></button>
          <div id="menu-panel-view" class="menu-panel" role="group" aria-label="View" hidden>
            <button id="menu-toggle-sidebar">Toggle Sidebar</button>
          </div>
          <button id="menu-section-help" class="menu-section" aria-expanded="false" aria-controls="menu-panel-help">Help <span class="menu-chevron" aria-hidden="true">&#8250;</span></button>
          <div id="menu-panel-help" class="menu-panel" role="group" aria-label="Help" hidden>
            <button id="menu-about">About AgentEd</button>
          </div>
        </nav>
        <div id="overflow-popover" class="hidden"></div>
        <aside id="assets-popover" class="cluster-popover hidden" role="dialog" aria-label="Images in this document"></aside>
        <aside id="cluster-popover" class="cluster-popover hidden" role="dialog" aria-label="Related context files"></aside>
        <aside id="appearance-popover" class="appearance-popover hidden" role="dialog" aria-label="Appearance settings"></aside>
      </header>
      <div id="main-area">
        <aside id="sidebar" class="hidden">
          <div id="sidebar-header">
            <span>Files</span>
            <button id="sidebar-close">&times;</button>
          </div>
          <div id="sidebar-tree"></div>
        </aside>
        <div id="editor-stack">
          <div id="search-panel" class="search-panel" hidden>
            <div class="search-row search-row-find">
              <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Find"
                spellcheck="false"
                autocomplete="off"
              />
              <div class="search-toggles">
                <button id="search-toggle-case" type="button" class="search-toggle" title="Match case (Alt+C)" aria-pressed="false">Aa</button>
                <button id="search-toggle-word" type="button" class="search-toggle" title="Whole word (Alt+W)" aria-pressed="false">[ab]</button>
                <button id="search-toggle-regex" type="button" class="search-toggle" title="Use regex (Alt+R)" aria-pressed="false">.*</button>
              </div>
              <span id="search-count" class="search-count">No results</span>
              <button id="search-find-prev" type="button" class="search-nav" title="Previous (Shift+Enter)">&#9650;</button>
              <button id="search-find-next" type="button" class="search-nav" title="Next (Enter)">&#9660;</button>
              <button id="search-close" type="button" class="search-close" title="Close (Esc)" aria-label="Close search">&times;</button>
            </div>
            <div class="search-row search-row-replace" hidden>
              <input
                type="text"
                id="search-replace-input"
                class="search-input"
                placeholder="Replace"
                spellcheck="false"
                autocomplete="off"
              />
              <button id="search-replace-single" type="button" class="search-action">Replace</button>
              <button id="search-replace-all" type="button" class="search-action">Replace All</button>
            </div>
          </div>
          <details id="frontmatter-panel" class="frontmatter-panel hidden">
            <summary>Metadata (YAML)</summary>
            <textarea id="frontmatter-input" spellcheck="false" placeholder="title: My document&#10;description: ..."></textarea>
          </details>
          <main id="editor"></main>
        </div>
      </div>
    </div>
    <div id="table-dialog" class="dialog-overlay hidden">
      <div class="dialog">
        <div class="dialog-title">Insert Table</div>
        <div class="dialog-fields">
          <label>Rows <input id="table-rows" type="number" min="1" max="50" value="3" /></label>
          <label>Columns <input id="table-cols" type="number" min="1" max="20" value="3" /></label>
        </div>
        <div class="dialog-actions">
          <button id="table-cancel">Cancel</button>
          <button id="table-confirm" class="primary">Insert</button>
        </div>
      </div>
    </div>
    <div id="link-dialog" class="dialog-overlay hidden">
      <div class="dialog">
        <div class="dialog-title">Link</div>
        <div class="dialog-fields">
          <label>Address <input id="link-url" type="text" spellcheck="false" autocomplete="off" placeholder="https://example.com or ./notes.md" /></label>
        </div>
        <div id="link-error" class="dialog-error hidden" role="alert"></div>
        <div class="dialog-actions">
          <button id="link-remove" class="danger hidden">Remove</button>
          <button id="link-cancel">Cancel</button>
          <button id="link-confirm" class="primary">Save</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
