<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentEd</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="menubar">
        <div class="header-left">
          <button id="menu-toggle" class="header-frame header-edge-button header-edge-button--icon" aria-label="Menu" aria-expanded="false" aria-controls="menu-dropdown">
            <svg class="header-edge-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M2 2h12" />
              <path d="M2 8h12" />
              <path d="M2 14h12" />
            </svg>
          </button>
          <span id="filename" title="Untitled">Untitled</span>
          <span id="modified-indicator" class="hidden">*</span>
        </div>
        <div class="header-right">
          <div id="header-indicators">
            <div id="count-readout" class="header-frame header-readout">
              <span id="token-number" class="indicator indicator-primary" title="– tokens">–</span>
              <span id="token-unit" class="indicator indicator-collapse-600">tokens</span>
              <span id="word-count" class="indicator indicator-secondary">– words</span>
              <span id="char-count" class="indicator indicator-secondary">– characters</span>
            </div>
            <button id="indicator-search" type="button" class="indicator header-frame header-edge-button header-edge-button--icon indicator-search indicator-collapse-800" title="Find (Ctrl+F)" aria-label="Find" aria-expanded="false" aria-controls="search-panel">
              <svg class="header-edge-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="6.5" cy="6.5" r="4.5" />
                <path d="M10 10 14 14" />
              </svg>
            </button>
            <span id="badge-metadata" class="indicator header-frame header-readout document-badge indicator-collapse-600" style="display:none" aria-hidden="true"></span>
            <button id="badge-images" type="button" class="indicator header-frame header-edge-button document-badge indicator-collapse-600" style="display:none" aria-hidden="true" aria-expanded="false" aria-controls="assets-popover"></button>
          </div>
          <button id="overflow-toggle" class="indicator-overflow header-frame header-edge-button header-edge-button--icon" aria-label="More indicators" aria-expanded="false" aria-controls="overflow-popover" title="Hover any indicator for details">
            <svg class="header-edge-icon" viewBox="0 0 16 16" fill="currentColor" stroke="none" aria-hidden="true">
              <circle cx="2.5" cy="8" r="1.5" />
              <circle cx="8" cy="8" r="1.5" />
              <circle cx="13.5" cy="8" r="1.5" />
            </svg>
          </button>
          <button id="appearance-menu-trigger" type="button" class="header-frame header-edge-button header-edge-button--icon appearance-menu-trigger" aria-label="Appearance settings" aria-expanded="false" aria-controls="appearance-popover" title="Appearance">
            <svg class="header-edge-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="8" cy="8" r="6" />
              <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="sidebar-toggle" type="button" class="header-frame header-edge-button header-edge-button--icon sidebar-toggle" aria-label="Files panel" aria-expanded="false" aria-controls="sidebar" title="Files panel (Ctrl+Shift+E)">
            <svg class="header-edge-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="12" height="12" rx="1.5" />
              <path d="M10 2v12" />
            </svg>
          </button>
        </div>
        <nav id="menu-dropdown" class="hidden">
          <button id="menu-section-file" class="menu-section" aria-expanded="false" aria-controls="menu-panel-file"><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>File</button>
          <div id="menu-panel-file" class="menu-panel" role="group" aria-label="File" hidden>
            <button id="menu-new">New</button>
            <button id="menu-new-from-template">New from Template…</button>
            <button id="menu-open" title="Ctrl+O" aria-keyshortcuts="Control+O">Open</button>
            <button id="menu-open-recent" aria-haspopup="true" aria-expanded="false" aria-controls="menu-recent" hidden>Open Recent<svg class="menu-chevron menu-recent-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg></button>
            <button id="menu-save" title="Ctrl+S" aria-keyshortcuts="Control+S">Save</button>
            <button id="menu-save-as">Save As</button>
            <button id="menu-close">Close file</button>
          </div>
          <button id="menu-section-edit" class="menu-section" aria-expanded="false" aria-controls="menu-panel-edit"><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>Edit</button>
          <div id="menu-panel-edit" class="menu-panel" role="group" aria-label="Edit" hidden>
            <button id="menu-find" title="Ctrl+F" aria-keyshortcuts="Control+F">Find</button>
            <button id="menu-replace" title="Ctrl+H" aria-keyshortcuts="Control+H">Replace</button>
            <button id="menu-find-next" title="F3" aria-keyshortcuts="F3">Find Next</button>
            <button id="menu-find-prev" title="Shift+F3" aria-keyshortcuts="Shift+F3">Find Previous</button>
            <button id="menu-undo" title="Ctrl+Z" aria-keyshortcuts="Control+Z">Undo</button>
            <button id="menu-redo" title="Ctrl+Y" aria-keyshortcuts="Control+Y">Redo</button>
            <button id="menu-select-all" title="Ctrl+A" aria-keyshortcuts="Control+A">Select All</button>
            <button id="menu-image-description">Image description</button>
            <button id="menu-spellcheck" aria-pressed="false">Spell check <span class="menu-shortcut menu-state" aria-hidden="true">Off</span></button>
          </div>
          <button id="menu-section-insert" class="menu-section" aria-expanded="false" aria-controls="menu-panel-insert"><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>Insert</button>
          <div id="menu-panel-insert" class="menu-panel" role="group" aria-label="Insert" hidden>
            <button id="menu-insert-table">Table</button>
            <button id="menu-insert-media">Media</button>
            <button id="menu-insert-code-block" title="Ctrl+Shift+K" aria-keyshortcuts="Control+Shift+K">Code Block</button>
            <button id="menu-insert-checklist">Checklist</button>
            <button id="menu-insert-horizontal-rule">Horizontal Rule</button>
            <button id="menu-insert-metadata">Metadata</button>
            <button id="menu-insert-emoji">Emoji</button>
          </div>
          <button id="menu-section-table" class="menu-section" aria-expanded="false" aria-controls="menu-panel-table"><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>Table</button>
          <div id="menu-panel-table" class="menu-panel" role="group" aria-label="Table" hidden>
            <button id="menu-table-add-row-above">Add Row Above</button>
            <button id="menu-table-add-row-below">Add Row Below</button>
            <button id="menu-table-delete-row">Delete Row</button>
            <button id="menu-table-add-column-before">Add Column Before</button>
            <button id="menu-table-add-column-after">Add Column After</button>
            <button id="menu-table-delete-column">Delete Column</button>
            <button id="menu-table-delete-table">Delete Table</button>
          </div>
          <button id="menu-section-help" class="menu-section" aria-expanded="false" aria-controls="menu-panel-help"><svg class="menu-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>Help</button>
          <div id="menu-panel-help" class="menu-panel" role="group" aria-label="Help" hidden>
            <button id="menu-about">About AgentEd</button>
          </div>
        </nav>
        <div id="overflow-popover" class="hidden"></div>
        <aside id="assets-popover" class="cluster-popover hidden" role="dialog" aria-label="Images in this document"></aside>
        <aside id="appearance-popover" class="appearance-popover hidden" role="dialog" aria-label="Appearance settings"></aside>
      </header>
      <div id="main-area">
        <div id="editor-stack">
          <div id="search-panel" class="search-panel" hidden>
            <div class="search-row search-row-find">
              <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Find"
                spellcheck="false"
                autocomplete="off"
              />
              <div class="search-toggles">
                <button id="search-toggle-case" type="button" class="search-toggle" title="Match case" aria-pressed="false">Aa</button>
                <button id="search-toggle-word" type="button" class="search-toggle" title="Whole word" aria-pressed="false">[ab]</button>
                <button id="search-toggle-regex" type="button" class="search-toggle" title="Search with patterns" aria-pressed="false">.*</button>
              </div>
              <span id="search-count" class="search-count">No results</span>
              <button id="search-find-prev" type="button" class="search-nav" title="Previous (Shift+Enter, Shift+F3)" aria-label="Previous">
                <svg class="search-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 8 6 4 10 8" />
                </svg>
              </button>
              <button id="search-find-next" type="button" class="search-nav" title="Next (Enter, F3)" aria-label="Next">
                <svg class="search-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 4 6 8 10 4" />
                </svg>
              </button>
              <button id="search-close" type="button" class="search-close" title="Close (Esc)" aria-label="Close search">
                <svg class="search-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1.5 1.5 10.5 10.5 M10.5 1.5 1.5 10.5" />
                </svg>
              </button>
            </div>
            <div class="search-row search-row-replace" hidden>
              <input
                type="text"
                id="search-replace-input"
                class="search-input"
                placeholder="Replace"
                spellcheck="false"
                autocomplete="off"
              />
              <button id="search-replace-single" type="button" class="search-action">Replace</button>
              <button id="search-replace-all" type="button" class="search-action">Replace All</button>
            </div>
          </div>
          <details id="frontmatter-panel" class="frontmatter-panel hidden">
            <summary>Metadata (YAML)</summary>
            <textarea id="frontmatter-input" spellcheck="false" placeholder="title: My document&#10;description: ..."></textarea>
          </details>
          <main id="editor"></main>
        </div>
        <aside id="sidebar" class="hidden">
          <div id="sidebar-header">
            <span>Files</span>
          </div>
          <div id="sidebar-tree"></div>
        </aside>
      </div>
    </div>
    <div id="table-dialog" class="dialog-overlay hidden">
      <div class="dialog">
        <div class="dialog-title">Insert Table</div>
        <div class="dialog-fields">
          <label>Rows <input id="table-rows" type="number" min="1" max="50" value="3" /></label>
          <label>Columns <input id="table-cols" type="number" min="1" max="20" value="3" /></label>
        </div>
        <div class="dialog-actions">
          <button id="table-cancel">Cancel</button>
          <button id="table-confirm" class="primary">Insert</button>
        </div>
      </div>
    </div>
    <div id="image-description-dialog" class="dialog-overlay hidden">
      <div class="dialog">
        <div class="dialog-title">Image description</div>
        <div class="dialog-note">Read out instead of the picture, and shown wherever the image cannot be loaded.</div>
        <div class="dialog-fields">
          <label>Description <input id="image-description-text" type="text" autocomplete="off" placeholder="A dog asleep on a sofa" /></label>
        </div>
        <div class="dialog-actions">
          <button id="image-description-cancel">Cancel</button>
          <button id="image-description-confirm" class="primary">Save</button>
        </div>
      </div>
    </div>
    <div id="link-dialog" class="dialog-overlay hidden">
      <div class="dialog">
        <div class="dialog-title">Link</div>
        <div class="dialog-fields">
          <label>Address <input id="link-url" type="text" spellcheck="false" autocomplete="off" placeholder="https://example.com or ./notes.md" /></label>
        </div>
        <div id="link-error" class="dialog-error hidden" role="alert"></div>
        <div class="dialog-actions">
          <button id="link-remove" class="danger hidden">Remove</button>
          <button id="link-cancel">Cancel</button>
          <button id="link-confirm" class="primary">Save</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
