# The licence check of CI (#476), by owner decisions of 2026-10-05 recorded on
# that issue. cargo-deny reads this file for the crates, and
# src/dependency-licences.test.ts reads the allow list below for the
# production npm packages of package-lock.json, so one list holds for both.
#
# A licence joins the list after a review of the package that brings it,
# never to make the check pass. The review of 2026-08-20 (#20, section C)
# found nothing incompatible in what is listed here.
#
# CI checks licences and sources alone. Advisories are checked by the weekly
# security.yml (#668), which reports and never fails a pull request or main:
# the RustSec database changes with no commit here, and on 2026-10-05 it
# marked six shipped crates unmaintained (fxhash and five of the unic family),
# which would have turned main red on its own. Bans are not checked: without a
# policy on duplicates they would report and decide nothing.

[graph]
# What the bundles ship, one target for each notices file the generator writes
# (#540). Build dependencies stay in, since cargo-deny reads them with the
# normal graph; dev dependencies do not ship. Linux joined with #550, which
# ships it; its build graph brings target-lexicon, excepted below.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
exclude-dev = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-3-Clause",
  "MPL-2.0",
  # Zlib, reviewed and allowed by owner decision of 2026-10-06 (#520): the
  # licence of foldhash 0.2.0, which Tauri 2.12 brings in through dom_query
  # and tauri-utils. Permissive, approved by OSI and the FSF, of the same
  # family as MIT; it asks that its notice stay with the source, which the
  # notices file of #475 carries.
  "Zlib",
  # The two below are here for the npm half and are met in no crate today:
  # Python-2.0 is the licence of argparse, BSD-2-Clause that of entities and
  # @mixmark-io/domino. They are not surplus; removing them turns the npm
  # test red.
  "Python-2.0",
  "BSD-2-Clause",
]
confidence-threshold = 0.93
# The two npm licences above are allowed and never met by a crate; that is
# by design rather than a stale entry.
unused-allowed-license = "allow"
# target-lexicon alone, under Apache-2.0 WITH LLVM-exception, by owner
# decision of 2026-10-06 (#540, comment 6024173825). Read in the crate at
# 0.12.16, the exception only removes conditions of Apache-2.0, which the
# list above holds. It is a build dependency of the GTK sys crates Tauri
# needs on Linux, reached through cfg-expr and system-deps, and ships in no
# binary. The licence is not added to the list, so no other crate gets it.
exceptions = [
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]

[sources]
# Crates come from crates.io and from nowhere else.
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Read by security.yml alone (#668). Unmaintained and unsound advisories are
# reported for every crate of the graph, so cargo-deny sees what cargo audit
# sees (owner decision 3 of 2026-10-28 on #668).
unmaintained = "all"
unsound = "all"
# Each advisory below was accepted by owner decision 1 of 2026-10-28 on #668,
# with its reason. An advisory not listed here is reported, and so is one
# listed here that no crate of the graph meets any more.
ignore = [
  # quick-xml 0.38.4, reached through plist and tauri-utils, which read the
  # XML of the application and not the documents a person opens (a reading);
  # until the next update of Tauri.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml through plist and tauri-utils reads the XML of the application, not of a document; until the next update of Tauri (#668)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml through plist and tauri-utils reads the XML of the application, not of a document; until the next update of Tauri (#668)" },
  # glib 0.18.5, Linux alone: no crate of that graph calls array_iter_str, the
  # reading of #550; Dependabot alert 27 was dismissed with the same reason.
  { id = "RUSTSEC-2024-0429", reason = "glib on Linux alone; no crate of the graph calls array_iter_str, the reading of #550 (#668)" },
  # proc-macro-error, unmaintained, runs at compile time alone.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained and runs at compile time alone (#668)" },
]
