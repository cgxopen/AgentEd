[package]
name = "agented"
version = "0.2.0"
description = "A WYSIWYG markdown editor for the generative-AI era"
authors = ["Cătălin Vasile"]
license = "MIT"
repository = "https://github.com/cgxopen/AgentEd"
default-run = "agented"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# #434: the preferred-languages list, the display language and the dialog
# when the main window cannot be built. Pinned to the version Tauri already pulls, whose Windows
# build already compiles these features, so no crate or feature is added.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# #539: every quit on macOS through the unsaved-changes gate, by a method
# added to the app delegate tao registers. A direct runtime dependency,
# approved by the owner on 2026-10-06 on #539: the objc2 tao already ships
# on macOS, at the version in Cargo.lock, so no crate is added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# #448: the shell open scope is tested with the regex crate the shell plugin
# itself compiles it with, already in Cargo.lock. Tests only; nothing ships.
[dev-dependencies]
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
