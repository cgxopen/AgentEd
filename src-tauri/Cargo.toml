[package]
name = "agented"
version = "0.2.0"
description = "WYSIWYG Markdown editor for AI agent knowledge bases"
authors = ["Cătălin Vasile"]
license = "MIT"
repository = "https://github.com/catge/agented"
default-run = "agented"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# #434: the preferred-languages list, the display language and the dialog
# when the main window cannot be built. Pinned to the version Tauri already pulls, whose Windows
# build already compiles these features, so no crate or feature is added.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
