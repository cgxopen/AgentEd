[package]
name = "agented"
version = "0.2.0"
description = "WYSIWYG Markdown editor for AI agent knowledge bases"
authors = ["Cătălin Vasile"]
license = "MIT"
repository = "https://github.com/catge/agented"
default-run = "agented"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# The one call the window frame needs (#326): `DwmSetWindowAttribute`, for the
# caption colour and the colour of what the system draws on it. Owner approval
# of 2026-09-16, under Q1.
#
# **No crate and no feature is added to the Windows build by this line.**
# Counted with `cargo tree --target x86_64-pc-windows-msvc` before it was
# written: `windows-sys` is already in the graph at 0.59.0, 0.60.2 and 0.61.2,
# `Win32_Graphics_Dwm` is already enabled on it, and the function itself is
# already linked, because `window-vibrancy` — a non-optional Windows dependency
# of `tauri` — calls it. What this adds is a direct edge to a crate that is
# already there.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
