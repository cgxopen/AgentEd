# Version updates (#19). Alerts and security updates are switched on in the
# repository settings; this file adds the weekly and monthly version updates,
# grouped so that minor and patch moves arrive as one pull request per
# ecosystem, and majors one by one, since they deserve their own review.
#
# Every pull request that moves package-lock.json or Cargo.lock meets two
# checks of CI: the licence check (#476) and the check that
# src-tauri/THIRD-PARTY-NOTICES.txt is current (#475). The second turns red
# whenever a version the file lists moves. The pull request is made green by
# one commit on its own branch with `npm run notices`, nothing else, as on
# #490. After such a commit Dependabot no longer rebases that pull request by
# itself; a rebase is then asked for by hand, or the commit is made again.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TipTap 3 is a migration of the editor engine rather than an update:
      # its first pull request (#489) moved twelve packages from 2.x to 3.x
      # and left @tiptap/pm on 2.x, and could not even be installed. It is
      # taken up on purpose, in an issue of its own, not proposed weekly.
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      # Tauri is updated by hand, as one pull request that moves both of its
      # halves together, the crates and these packages (#520): proposed
      # apart, each half is red at the version match of the Tauri CLI, as
      # #491 was. A rule that names the dependency and no versions stops its
      # version updates and leaves its security updates on: for a security
      # update Dependabot keeps only the versions an ignore rule lists, read
      # in dependabot-core, common/lib/dependabot/config/ignore_condition.rb,
      # on 2026-10-06. The same rule stands in the cargo entry below.
      - dependency-name: "@tauri-apps/*"
      # marked stays on 15 for now (#523): it parses every file AgentEd opens,
      # and from 16 to 18 it reads task items, emphasis runs and trailing
      # blank lines differently, so that 97 round-trip tests go red and files
      # would be altered on save. Its majors are not proposed weekly until
      # #523 is taken up; remove this rule with it.
      - dependency-name: marked
        update-types: ["version-update:semver-major"]

  # A manifest of its own, so it needs an entry of its own: a single npm entry
  # would leave the Rust side unwatched.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # By hand with its npm half, as one pull request (#520); the comment
      # beside the npm rule says why, and why security updates still arrive.
      - dependency-name: "tauri*"

  # The workflows pin third-party actions to commit SHAs, so they never drift
  # and never receive a fix either unless something moves them. Dependabot
  # reads SHA pins and moves them, with the version in the comment beside.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
