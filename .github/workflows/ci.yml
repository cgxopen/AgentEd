name: CI

# Ceilings, and what they do and do not cover.
#
# Every step that touches the network or compiles something carries its own
# `timeout-minutes`, sized from real runs rather than from a guess; every job
# carries one as a backstop, sized above a fully cold healthy run (#47).
# Short shell steps are left to the job ceiling.
#
# `timeout-minutes` starts counting when a job begins executing on a runner.
# A job waiting for a runner is not covered by any number here, so none of
# these ceilings protect against a queue that never clears.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    # Pinned rather than ubuntu-latest (#591): that label moves to Ubuntu 26
    # from 2026-10-19, and a job would change image with nothing changed here.
    # Moving to Ubuntu 26 is its own change, made on purpose, with the apt
    # step of the rust job measured on that image first.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      guarded_docs: ${{ steps.decide.outputs.guarded_docs }}
      build_sha: ${{ steps.identity.outputs.build_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      # Pinned to commit SHA, not tag (supply chain).
      # Runs on pushes too, not only pull requests: on a push to `main` the
      # action compares against `github.event.before`, which is what stops a
      # documentation merge from rebuilding everything (#57).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        timeout-minutes: 5
        # Fail open — see the step below.
        continue-on-error: true
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'public/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.setup.ts'
              - 'biome.json'
              - '.editorconfig'
              - '.github/**'
            # The documents `src/editor/roundtrip.test.ts` reads as **test
            # input** (#118). They are not code and must not gate the Rust or
            # Windows jobs — nothing they change can affect either — but a
            # change to one of them changes what the round-trip guard is run
            # against, so the job that runs it has to run.
            #
            # Named one by one rather than as `docs/**`: five of the six are
            # at the repository root, so no directory pattern reaches them,
            # and a wildcard would also pull in documents the guard does not
            # read. The seeds under `src/templates/` need no entry — `src/**`
            # in `code:` already covers them.
            #
            # This list and the guard's own must not drift. `ci.test.ts`
            # reads both and fails when a document the guard reads is matched
            # by neither filter, which is the failure this issue exists for.
            #
            # Spelled with an underscore, and it is the same spelling in all
            # three places it appears — the filter name here, the expression
            # that reads it, and the job output. A hyphen reads correctly in
            # an expression (measured on this branch: `false`, not `NaN`), so
            # this is not a fix; it is this pull request's own argument
            # applied to itself. Two spellings of one name, transliterated by
            # hand between two files, is the shape that produced #118.
            guarded_docs:
              - 'CLAUDE.md'
              - 'CONTRIBUTING.md'
              - 'README.md'
              - 'REQUIREMENTS.md'
              - 'SECURITY.md'
              - 'docs/ADR/ADR-001-reset-and-simplification.md'

      - name: Decide whether the code jobs run
        id: decide
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_DOCS: ${{ steps.filter.outputs.guarded_docs }}
        run: |
          set -euo pipefail
          # Fail open, deliberately: a push with no usable comparison point —
          # a force push whose old head is gone, a payload without `before` —
          # must build everything rather than skip everything. Skipping on a
          # failure to answer would be a silent green.
          #
          # Both outputs fail open together. A non-answer says nothing about
          # either question, so neither may be treated as answered "no".
          if [ "$FILTER_OUTCOME" = "success" ] && [ -n "$FILTER_CODE" ] && [ -n "$FILTER_DOCS" ]; then
            echo "code=$FILTER_CODE" >> "$GITHUB_OUTPUT"
            echo "guarded_docs=$FILTER_DOCS" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The path filter did not answer (outcome: ${FILTER_OUTCOME}). Running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "guarded_docs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the build
        id: identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One value, used twice: it names the installer artifact and it is
          # what the running application reports under About (#64). On a
          # `pull_request` event `github.sha` is the ephemeral merge commit,
          # which is not the sha the pull request page shows, so the head of
          # the branch is used instead. Short, because About shows seven
          # characters and the check this exists for is a human comparing two
          # strings.
          sha="${PR_HEAD_SHA:-$RUN_SHA}"
          echo "build_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (lint + typecheck + test + build)
    needs: changes
    # The one job that documents can start. `roundtrip.test.ts` reads the
    # repository's documents as test input (#118), so a change to one of
    # them changes what this job is run against. Rust and Windows below
    # stay on `code` alone — nothing a document changes can reach either.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guarded_docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
        timeout-minutes: 10
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm test
        timeout-minutes: 15
      - run: npm run build
        timeout-minutes: 15
        env:
          # The same single value the Windows job bakes in and names its
          # artifact with (#64). Without it `vite.config.ts` falls back to
          # `GITHUB_SHA`, which on a `pull_request` event is the ephemeral
          # merge commit — so this build reported seven characters nobody
          # could match against the pull request page. That cost nothing
          # while no one published it; #131 publishes it.
          AGENTED_BUILD_COMMIT: ${{ needs.changes.outputs.build_sha }}

      # A web build a person can download, serve and open, so a defect
      # that only exists on this platform can be met by hand (#131). Two
      # of them in a row — #126 and #129 — could not be, and the second
      # was reached only through a port-forwarded dev server, which has no
      # artifact and therefore no sha to compare.
      #
      # Storage and packaging only: `npm run build` above already runs on
      # every pull request that reaches this job. Measured on this branch:
      # the output is 1.7 MB across 14 files, 0.70 MB once packed, and the
      # existing 2.58 MB Windows upload takes 9 seconds. The frontend job
      # has run 77-100 seconds over its last twelve runs, all of which bill
      # as 2 minutes, and the next boundary is 120 — so this adds no
      # billable minute at all.
      - name: Bundle the starter with the build
        if: needs.changes.outputs.code == 'true'
        run: cp .github/web-artifact/serve.ps1 .github/web-artifact/HOW-TO-RUN.txt dist/

      # **Narrower than the job it sits in, deliberately.** This job also
      # runs for `guarded_docs` — the seven documents the round-trip guard
      # reads as test input (#118) — and a web build published on a
      # documentation edit is seconds spent on something nobody will download. The build
      # is what those documents change; the artifact is not.
      - name: Upload web build
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 10
        with:
          name: AgentEd-web-${{ needs.changes.outputs.build_sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  rust:
    name: Rust (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable branch, 2026-10-01
        id: toolchain
        timeout-minutes: 10
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Linux system deps
        # The ceiling that catches a stall is the per-attempt `timeout`, not
        # the step's: apt has legitimately taken 19m 44s here and succeeded,
        # so a single tight ceiling would clip a passing run. A tight
        # per-attempt ceiling plus a retry turns a stalled mirror into a slow
        # success instead of a red mark that needs a human re-run. The step
        # ceiling below is the backstop for the loop itself misbehaving.
        timeout-minutes: 16
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} stalled or failed."
            sleep 5
          done
          echo "::error::apt did not complete within its budget after 2 attempts."
          exit 1
      # Two caches, because the two halves go stale for different reasons
      # (#53). Downloaded sources depend on the lockfile and on nothing else,
      # so they fall back widely and are never thrown away. Compiled
      # artifacts depend on the compiler as well: cargo's fingerprints
      # include the rustc version, so the day `stable` moves, everything in
      # `src-tauri/target` is dead weight.
      #
      # That is what had gone wrong. The old key was the lockfile hash alone,
      # `Cargo.lock` has not moved since 14 August, and `actions/cache` saves
      # only on a miss — so the 14 August entry was restored on every run and
      # never replaced. When `stable` went from 1.97.1 to 1.98.0 the entry
      # became useless and stayed: a reported cache hit, 654 MB restored, and
      # 299 crates recompiled anyway, on every run.
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        with:
          path: src-tauri/target
          # The fallback stays inside one toolchain on purpose. A changed
          # lockfile falls back and rebuilds only what changed — the fork
          # case, where a pull request can read this cache but not write one.
          # A changed toolchain does not fall back at all: cargo would ignore
          # what it restored, but `actions/cache` would save it again, and the
          # entry would carry every dead toolchain's artifacts forever.
          # Measured on this branch's first run, which inherited one such set:
          # 654 MB in, 1275 MB out.
          key: ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        timeout-minutes: 20
        working-directory: src-tauri
      - run: cargo test
        timeout-minutes: 20
        working-directory: src-tauri
      # The third-party notices the installer ships (#475) are generated from
      # the crate graph and from package-lock.json, and committed. This fails
      # when a lockfile change, or a licence an update brought, left the file
      # stale. In this job because only `cargo tree` knows the crate graph, and
      # the registry cache above already holds the crate sources it reads the
      # licence files from; Node comes along for the script and the npm half.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Third-party notices are current
        timeout-minutes: 10
        run: npm run notices -- --check
      # The licence check (#476): cargo-deny over the crates the installer
      # ships, against the allow list in `src-tauri/deny.toml`, which the npm
      # half in `src/dependency-licences.test.ts` reads too. Licences and
      # sources only; why not advisories or bans is written in that file.
      #
      # A pinned release binary, its checksum checked before it runs, rather
      # than an action or a build from source: 4.9 MB, under a second to fetch,
      # where compiling it would cost minutes.
      - name: Install cargo-deny
        timeout-minutes: 5
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$archive.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Dependency licences and sources are allowed
        timeout-minutes: 5
        working-directory: src-tauri
        run: |
          if ! cargo-deny --locked check licenses sources; then
            echo "::error::A crate brings a licence or a source that src-tauri/deny.toml does not allow; cargo-deny names it above. The allow list changes after a review of that crate, never to make this check pass."
            exit 1
          fi

  build-windows:
    name: Build Windows (primary target)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable branch, 2026-10-01
        id: toolchain
        timeout-minutes: 10
        with:
          toolchain: stable
      # Same two caches, same reasoning; see the Rust job.
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-
      - run: npm ci
        timeout-minutes: 10
      # Once more if the first attempt fails (#501). `tauri build` downloads
      # the bundler tools from GitHub on every run, since a fresh runner has
      # none: WiX and NSIS, and nsis_tauri_utils.dll for the installer. One of
      # those downloads answered `http status: 500` on run 37356550344, and
      # an outage that is not ours turned the job red. A retry does not hide
      # a real failure: a build that fails twice is red, and the warning
      # below says in the log, and on the run page, that a second attempt
      # was made.
      - name: Build the installer
        timeout-minutes: 40
        shell: bash
        run: |
          if npm run tauri build; then exit 0; fi
          echo "::warning::npm run tauri build failed; running it once more, since its downloads of the bundler tools can fail on an outage upstream (#501). A second failure is the result."
          npm run tauri build
        env:
          # The build says who it is from the inside, and the artifact below
          # says who it is from the outside. Both read
          # `needs.changes.outputs.build_sha` — one value, so they cannot
          # drift apart, which is the only thing that makes comparing them
          # worth doing (#64).
          AGENTED_BUILD_COMMIT: ${{ needs.changes.outputs.build_sha }}
      # Storage only — the build above already runs on every code PR.
      # NSIS setup.exe only: the .msi is redundant for end users and the
      # uncompressed bundle intermediates would multiply storage for no gain.
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 10
        with:
          name: AgentEd-windows-${{ needs.changes.outputs.build_sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  pipeline-ok:
    name: Pipeline OK
    needs: [changes, frontend, rust, build-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict on required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # "skipped" counts as success (docs-only changes, on a pull request
          # and on a push to main alike); only failure or cancellation of a
          # needed job fails the pipeline. This is the single required check,
          # so a docs-only change has to reach it and pass — which is why the
          # job runs `always()` and gates on nothing.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key) | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: ${failed}"
            exit 1
          fi
