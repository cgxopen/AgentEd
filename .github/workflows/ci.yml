name: CI

# Ceilings, and what they do and do not cover.
#
# Every step that touches the network or compiles something carries its own
# `timeout-minutes`, sized from real runs rather than from a guess; every job
# carries one as a backstop, sized above a fully cold healthy run (#47).
# Short shell steps are left to the job ceiling.
#
# `timeout-minutes` starts counting when a job begins executing on a runner.
# A job waiting for a runner is not covered by any number here, so none of
# these ceilings protect against a queue that never clears.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      guarded_docs: ${{ steps.decide.outputs.guarded_docs }}
      build_sha: ${{ steps.identity.outputs.build_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
      # Pinned to commit SHA, not tag (supply chain).
      # Runs on pushes too, not only pull requests: on a push to `main` the
      # action compares against `github.event.before`, which is what stops a
      # documentation merge from rebuilding everything (#57).
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        timeout-minutes: 5
        # Fail open — see the step below.
        continue-on-error: true
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'public/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.setup.ts'
              - 'biome.json'
              - '.editorconfig'
              - '.github/**'
            # The documents `src/editor/roundtrip.test.ts` reads as **test
            # input** (#118). They are not code and must not gate the Rust or
            # Windows jobs — nothing they change can affect either — but a
            # change to one of them changes what the round-trip guard is run
            # against, so the job that runs it has to run.
            #
            # Named one by one rather than as `docs/**`: five of the eight are
            # at the repository root, so no directory pattern reaches them,
            # and a wildcard would also pull in documents the guard does not
            # read. The four under `src/templates/` need no entry — `src/**`
            # in `code:` already covers them.
            #
            # This list and the guard's own must not drift. `ci.test.ts`
            # reads both and fails when a document the guard reads is matched
            # by neither filter, which is the failure this issue exists for.
            guarded-docs:
              - 'CLAUDE.md'
              - 'CONTRIBUTING.md'
              - 'README.md'
              - 'REQUIREMENTS.md'
              - 'SECURITY.md'
              - 'docs/ADR/ADR-001-reset-and-simplification.md'
              - 'docs/internal/STATUS.md'
              - 'docs/internal/WORKFLOW.md'

      - name: Decide whether the code jobs run
        id: decide
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_DOCS: ${{ steps.filter.outputs.guarded-docs }}
        run: |
          set -euo pipefail
          # Fail open, deliberately: a push with no usable comparison point —
          # a force push whose old head is gone, a payload without `before` —
          # must build everything rather than skip everything. Skipping on a
          # failure to answer would be a silent green.
          #
          # Both outputs fail open together. A non-answer says nothing about
          # either question, so neither may be treated as answered "no".
          if [ "$FILTER_OUTCOME" = "success" ] && [ -n "$FILTER_CODE" ] && [ -n "$FILTER_DOCS" ]; then
            echo "code=$FILTER_CODE" >> "$GITHUB_OUTPUT"
            echo "guarded_docs=$FILTER_DOCS" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The path filter did not answer (outcome: ${FILTER_OUTCOME}). Running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "guarded_docs=true" >> "$GITHUB_OUTPUT"
          fi

      # TEMPORARY (#118): settle by measurement whether a hyphenated output
      # name can be dereferenced with a dot in a GitHub expression. Removed
      # in the next commit on this branch.
      - name: MEASUREMENT — how each spelling reads
        env:
          HYPHEN: ${{ steps.filter.outputs.guarded-docs }}
          UNDERSCORE: ${{ steps.filter.outputs.guarded_docs }}
        run: |
          echo "hyphen-read    =[${HYPHEN}]"
          echo "underscore-read=[${UNDERSCORE}]"

      - name: Name the build
        id: identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One value, used twice: it names the installer artifact and it is
          # what the running application reports under About (#64). On a
          # `pull_request` event `github.sha` is the ephemeral merge commit,
          # which is not the sha the pull request page shows, so the head of
          # the branch is used instead. Short, because About shows seven
          # characters and the check this exists for is a human comparing two
          # strings.
          sha="${PR_HEAD_SHA:-$RUN_SHA}"
          echo "build_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (lint + typecheck + test + build)
    needs: changes
    # The one job that documents can start. `roundtrip.test.ts` reads the
    # repository's documents as test input (#118), so a change to one of
    # them changes what this job is run against. Rust and Windows below
    # stay on `code` alone — nothing a document changes can reach either.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guarded_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 10
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
        timeout-minutes: 10
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm test --if-present
        timeout-minutes: 15
      - run: npm run build
        timeout-minutes: 15

  rust:
    name: Rust (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable branch, 2026-07-16
        id: toolchain
        timeout-minutes: 10
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Linux system deps
        # The ceiling that catches a stall is the per-attempt `timeout`, not
        # the step's: apt has legitimately taken 19m 44s here and succeeded,
        # so a single tight ceiling would clip a passing run. A tight
        # per-attempt ceiling plus a retry turns a stalled mirror into a slow
        # success instead of a red mark that needs a human re-run. The step
        # ceiling below is the backstop for the loop itself misbehaving.
        timeout-minutes: 16
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} stalled or failed."
            sleep 5
          done
          echo "::error::apt did not complete within its budget after 2 attempts."
          exit 1
      # Two caches, because the two halves go stale for different reasons
      # (#53). Downloaded sources depend on the lockfile and on nothing else,
      # so they fall back widely and are never thrown away. Compiled
      # artifacts depend on the compiler as well: cargo's fingerprints
      # include the rustc version, so the day `stable` moves, everything in
      # `src-tauri/target` is dead weight.
      #
      # That is what had gone wrong. The old key was the lockfile hash alone,
      # `Cargo.lock` has not moved since 14 August, and `actions/cache` saves
      # only on a miss — so the 14 August entry was restored on every run and
      # never replaced. When `stable` went from 1.97.1 to 1.98.0 the entry
      # became useless and stayed: a reported cache hit, 654 MB restored, and
      # 299 crates recompiled anyway, on every run.
      - name: Cargo registry cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 15
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cargo build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 15
        with:
          path: src-tauri/target
          # The fallback stays inside one toolchain on purpose. A changed
          # lockfile falls back and rebuilds only what changed — the fork
          # case, where a pull request can read this cache but not write one.
          # A changed toolchain does not fall back at all: cargo would ignore
          # what it restored, but `actions/cache` would save it again, and the
          # entry would carry every dead toolchain's artifacts forever.
          # Measured on this branch's first run, which inherited one such set:
          # 654 MB in, 1275 MB out.
          key: ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        timeout-minutes: 20
        working-directory: src-tauri
      - run: cargo test
        timeout-minutes: 20
        working-directory: src-tauri

  build-windows:
    name: Build Windows (primary target)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 10
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable branch, 2026-07-16
        id: toolchain
        timeout-minutes: 10
        with:
          toolchain: stable
      # Same two caches, same reasoning; see the Rust job.
      - name: Cargo registry cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 15
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cargo build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 15
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.toolchain.outputs.cachekey }}-
      - run: npm ci
        timeout-minutes: 10
      - run: npm run tauri build
        timeout-minutes: 40
        env:
          # The build says who it is from the inside, and the artifact below
          # says who it is from the outside. Both read
          # `needs.changes.outputs.build_sha` — one value, so they cannot
          # drift apart, which is the only thing that makes comparing them
          # worth doing (#64).
          AGENTED_BUILD_COMMIT: ${{ needs.changes.outputs.build_sha }}
      # Storage only — the build above already runs on every code PR.
      # NSIS setup.exe only: the .msi is redundant for end users and the
      # uncompressed bundle intermediates would multiply storage for no gain.
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 10
        with:
          name: AgentEd-windows-${{ needs.changes.outputs.build_sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  pipeline-ok:
    name: Pipeline OK
    needs: [changes, frontend, rust, build-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict on required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # "skipped" counts as success (docs-only changes, on a pull request
          # and on a push to main alike); only failure or cancellation of a
          # needed job fails the pipeline. This is the single required check,
          # so a docs-only change has to reach it and pass — which is why the
          # job runs `always()` and gates on nothing.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key) | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: ${failed}"
            exit 1
          fi
