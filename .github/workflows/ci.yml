name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Pinned to commit SHA, not tag (supply chain).
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'public/**'
              - 'index.html'
              - 'package*.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.setup.ts'
              - 'biome.json'
              - '.editorconfig'
              - '.github/**'

  frontend:
    name: Frontend (lint + typecheck + test + build)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build

  rust:
    name: Rust (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable branch, 2026-07-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build-windows:
    name: Build Windows (primary target)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable branch, 2026-07-16
        with:
          toolchain: stable
      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run tauri build

      # ── TEMPORARY (PR #7 only) — remove before merge ──
      # Nightly Build cannot be dispatched on this branch: workflow_dispatch
      # requires the workflow file to exist on the default branch, and
      # nightly.yml only lands on main through this PR. These two steps give
      # the owner the Windows installer for the size check and the manual
      # smoke test. Delete both once verification is done; nightly.yml is
      # the permanent home for artifact uploads.
      - name: Report bundle sizes (temporary)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File src-tauri/target/release/bundle |
            Select-Object @{n='Size (bytes)';e={$_.Length}}, FullName |
            Format-Table -AutoSize
      - name: Upload Windows installer (temporary)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AgentEd-pr7-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*
          retention-days: 7
          if-no-files-found: error

  pipeline-ok:
    name: Pipeline OK
    needs: [changes, frontend, rust, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict on required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # "skipped" counts as success (docs-only PRs); only failure or
          # cancellation of a needed job fails the pipeline.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key) | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: ${failed}"
            exit 1
          fi
