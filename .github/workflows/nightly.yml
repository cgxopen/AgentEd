name: Nightly Build

on:
  schedule:
    # Mondays, 03:00 UTC = 06:00 Europe/Bucharest.
    #
    # Weekly rather than daily (owner decision, 2026-08-24). What this run
    # catches that pull-request CI cannot is environment drift — a runner
    # image, a toolchain or an upstream package moving underneath us — and
    # that is weekly-scale. Code drift is not possible here: `main` moves only
    # through reviewed pull requests, every one of which runs the full suite
    # against the tree being merged. Monday puts a week's drift in front of
    # someone at the start of a working week rather than over a weekend.
    # Revisited at publication.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macOS in the build matrix (manual verification build)'
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Activity guard + matrix
    # Pinned rather than ubuntu-latest (#591): that label moves to Ubuntu 26
    # from 2026-10-19, and a job would change image with nothing changed here.
    # Moving to Ubuntu 26 is its own change, made on purpose, with the apt
    # step of the rust job measured on that image first.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Skip if no new commits since last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On scheduled runs, skip if HEAD matches the head SHA of the
          # last successful nightly - otherwise we pay for identical builds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ -n "$last_sha" ] && [ "$last_sha" = "${{ github.sha }}" ]; then
            echo "No new commits since last successful nightly ($last_sha) - skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build matrix
        id: matrix
        run: |
          # Windows is the primary target, and Linux is built here as well as
          # in the release since #550, where it ships labelled experimental.
          # Both are built on every scheduled run.
          #
          # Linux is built here rather than in `ci.yml` for the reason it
          # always was (#8). The Rust job there already compiles the whole
          # crate graph for this platform on every code change, so a per-pull-
          # request bundle would only add packaging failures - and those come
          # from a runner image or an upstream tool moving, not from anything
          # in `src/`. That is environment drift, which is the weekly-scale
          # thing this workflow exists for.
          #
          # The release builds the deb alone; the rpm is built here too, with
          # the same desktop entry and the same glibc floor, so a later test
          # on Fedora needs no code (#550, owner decision 4).
          #
          # `--bundles deb,rpm` leaves AppImage out, and it is left out for
          # what it costs rather than because it breaks. It builds here: the
          # first Linux run this repository ever had, 34037705792 on
          # `ubuntu-22.04`, produced all three bundles. (It fails on a
          # machine with no `/usr/bin/xdg-open`, which no step here installs
          # and the runner image happens to carry - that was measured on a
          # workstation and does not describe this builder.)
          #
          # What it costs is the artifact. That run uploaded 194292233 bytes
          # for Linux against 5839869 for Windows, weekly and kept 7 days,
          # because the AppDir carries a copy of WebKit; the deb and the rpm
          # on their own are 13 files and 17858450 bytes before compression.
          # It also spent about 2 minutes of a 9-minute job.
          #
          # And it is not the portable escape hatch it looks like: an
          # AppImage carries libraries but not libc, so it inherits the same
          # glibc floor as the deb.
          #
          # macOS stays behind an explicit manual request: those runners bill
          # at ~10x the Linux rate, and nothing here can test the result.
          entries='{"platform":"windows-latest","label":"windows","args":""}'
          entries="$entries,{\"platform\":\"ubuntu-22.04\",\"label\":\"linux\",\"args\":\"--bundles deb,rpm\"}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.include_macos }}" = "true" ]; then
            entries="$entries,{\"platform\":\"macos-latest\",\"label\":\"macos\",\"args\":\"\"}"
          fi
          matrix="{\"include\":[$entries]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    # Ceilings as in ci.yml: each network-bound or compiling step carries its
    # own, the job carries a backstop above a fully cold healthy build. None
    # of them cover time spent queueing for a runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable branch, 2026-10-01
        timeout-minutes: 10
        with:
          toolchain: stable

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        # The ceiling that catches a stalled mirror is the per-attempt
        # `timeout`; the step ceiling is the backstop. Same shape and same
        # reasoning as ci.yml.
        timeout-minutes: 16
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} stalled or failed."
            sleep 5
          done
          echo "::error::apt did not complete within its budget after 2 attempts."
          exit 1

      - run: npm ci
        timeout-minutes: 10
      # Once more if the first attempt fails, as in ci.yml (#501): the
      # bundler tools are downloaded on every run and a download can fail on
      # an outage upstream. A build that fails twice is red.
      - name: Build the bundles
        timeout-minutes: 45
        shell: bash
        run: |
          if npm run tauri build -- ${{ matrix.args }}; then exit 0; fi
          echo "::warning::npm run tauri build failed; running it once more, since its downloads of the bundler tools can fail on an outage upstream (#501). A second failure is the result."
          npm run tauri build -- ${{ matrix.args }}
        env:
          # The commit this build is of, passed explicitly (#41). It used to
          # be left to `vite.config.ts`, which fell back to `GITHUB_SHA` when
          # nothing set this — right here, and wrong on a `pull_request`
          # event, where `GITHUB_SHA` is the ephemeral merge commit. That rung
          # is gone, so a build with no value here reports `dev` rather than a
          # sha it cannot substantiate. `github.sha` is the commit anyone
          # means on this workflow's events: `schedule` and
          # `workflow_dispatch`, neither of which builds a merge commit.
          AGENTED_BUILD_COMMIT: ${{ github.sha }}

      # ── The glibc the Linux binary needs, against the floor it declares (#550) ──
      #
      # The deb declares libc6 (>= 2.34) and the rpm libc.so.6(GLIBC_2.34)(64bit),
      # in src-tauri/tauri.linux.conf.json. The binary needs the glibc of the
      # runner that built it, and nothing else holds the two together: the
      # floor rides on the ubuntu-22.04 image, which GitHub will retire one
      # day, and a build on a newer image would still install on an older
      # system and fail at launch on a missing symbol. So the binary in the
      # deb is read, and the job fails if it needs a GLIBC_ version above the
      # floor, or if the deb no longer declares the floor this step holds.
      - name: 'Linux: the binary needs no glibc above the declared floor'
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 5
        env:
          GLIBC_FLOOR: '2.34'
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          depends=$(dpkg-deb --field "${debs[0]}" Depends)
          echo "Depends: $depends"
          if ! grep -qF "libc6 (>= $GLIBC_FLOOR)" <<< "$depends"; then
            echo "::error::The deb does not declare libc6 (>= $GLIBC_FLOOR)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb"
          versions=$(objdump -T "$RUNNER_TEMP/deb/usr/bin/agented" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV)
          highest=$(tail -n 1 <<< "$versions")
          echo "GLIBC_ versions needed: $(tr '\n' ' ' <<< "$versions")"
          echo "Highest: $highest; declared floor: $GLIBC_FLOOR"
          if [ -z "$highest" ]; then
            echo "::error::No GLIBC_ symbol was read from the binary."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$highest" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::The binary needs GLIBC_$highest, above the declared floor $GLIBC_FLOOR."
            exit 1
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 15
        with:
          name: AgentEd-nightly-${{ matrix.label }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*
          retention-days: 7
          if-no-files-found: error
