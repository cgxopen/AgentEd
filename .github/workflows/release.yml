name: Release

# Ceilings (#47). Same shape and same reasoning as `ci.yml`, which carries the
# argument in full: every network or compile step gets its own
# `timeout-minutes`, every job a backstop above a fully cold healthy run, and
# queue time is covered by none of them.
#
# The numbers here are **transcribed rather than measured**: this workflow has
# never run, no tag having been built. They come from the jobs of the same
# shape - `nightly.yml` builds Windows with no cargo cache, exactly as this
# does, and its Windows job took 708 seconds on run 34037705792. The first tag
# is what measures them.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-draft:
    strategy:
      fail-fast: false
      # A release is Windows alone. Linux is built on nightly only until it
      # turns user-facing, because a release hands a user a product and
      # REQUIREMENTS section 7 says this one is not that yet.
      #
      # macOS is absent for its own reason, also in section 7: nothing here
      # can test the result, and an unsigned macOS build reaches a user
      # through Gatekeeper as a file that cannot be opened. There is a known
      # collision waiting too - the bundle identifier ends with `.app`, which
      # Tauri warns about because it is the macOS application bundle
      # extension.
      #
      # Each returns when it becomes a shipped target, and section 7 carries
      # what that takes.
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    # Above a fully cold healthy run by a wide margin: the same job in
    # `nightly.yml`, which also builds with no cargo cache, took 708 seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 10
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable branch, 2026-07-16
        timeout-minutes: 10
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        # Guarded on a platform the matrix no longer carries (#227 left the
        # step so Linux returns as one matrix line). A ceiling on a step that
        # does not run costs nothing, and the step is ready when it does.
        #
        # The ceiling that catches a stall is the per-attempt `timeout`, not
        # the step's: apt has legitimately taken 19m 44s in `ci.yml` and
        # succeeded, so a single tight ceiling would clip a passing run. The
        # loop below is copied from `ci.yml` rather than rewritten, so all
        # three workflows say the same thing.
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 16
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} stalled or failed."
            sleep 5
          done
          echo "::error::apt did not complete within its budget after 2 attempts."
          exit 1

      - run: npm ci
        timeout-minutes: 10

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        # The action runs the frontend build and the Rust build and then
        # uploads the assets, so this is the compile step and the widest
        # ceiling in the file. 45, as the same build carries in
        # `nightly.yml`; the upload it adds is a few megabytes.
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit this release is of, passed explicitly (#41). The action
          # runs the frontend build internally, and `vite.config.ts` no longer
          # falls back to `GITHUB_SHA` — so without this a released installer
          # would report `local development build (not from CI)` under About,
          # which is visibly wrong to a user rather than quietly wrong. On a
          # tag push `github.sha` is the tagged commit, which is the commit
          # anyone means.
          #
          # **That this `env:` reaches the build the action starts is a
          # reading, not a measurement.** It is third-party code and no tag
          # has ever been built here, so what covers it is the contract
          # assertion in ci.test.ts rather than a run.
          AGENTED_BUILD_COMMIT: ${{ github.sha }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentEd ${{ github.ref_name }}'
          releaseBody: |
            ## What's new

            <!-- Edit this section manually before publishing.
                 Highlight 3-5 user-facing changes. Keep it scannable.
                 Use GitHub's "Auto-generate release notes" button to append
                 the commit/PR list automatically, then trim to essentials. -->

            _Edit this section before publishing._

            ## Download

            | Platform | Installer |
            |---|---|
            | Windows | `AgentEd_${{ github.ref_name }}_x64-setup.exe` |

            First time? Most users want the installer for their OS above.

            <details>
            <summary><b>For developers - technical details</b></summary>

            ### Verify checksums
            Each asset has a `.sha256` sidecar; the combined `SHA256SUMS.txt`
            lists all hashes in one file. Verify after download:
            - PowerShell: `Get-FileHash AgentEd_*.exe -Algorithm SHA256`

            ### Build from source
            See `README.md` for build instructions.

            ### Changes in this release
            Click "Auto-generate release notes" in the edit view to append PR/commit list.

            </details>
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  curate-assets:
    needs: build-and-draft
    runs-on: ubuntu-latest
    # Its work is a handful of API calls and a few megabytes of download, so
    # this is a backstop rather than a budget - the same relation to its steps
    # that every job ceiling in `ci.yml` has to its own.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Hide intermediate bundles and redundant installers
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Wait for all matrix builds to finish uploading
          sleep 10

          echo "Current assets on $TAG:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name'

          # Delete .tar.gz app bundles (intermediate, not for end users)
          for asset in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | grep -E '\.app\.tar\.gz$' || true); do
            echo "Removing intermediate bundle: $asset"
            gh release delete-asset "$TAG" "$asset" --yes --repo "${{ github.repository }}" || true
          done

          # Delete .msi (redundant with -setup.exe for Windows users)
          for asset in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | grep -E '\.msi$' || true); do
            echo "Removing redundant installer: $asset"
            gh release delete-asset "$TAG" "$asset" --yes --repo "${{ github.repository }}" || true
          done

          echo "Assets after curation:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name'

      - name: Generate SHA-256 checksums
        # Downloads every release asset before hashing it, so it is
        # network-bound and gets its own ceiling rather than the job's.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _release_assets
          cd _release_assets

          # Download every curated asset so we can hash it locally.
          mapfile -t assets < <(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            echo "Downloading $asset"
            gh release download "$TAG" --pattern "$asset" \
              --repo "${{ github.repository }}" --clobber
          done

          # Per-asset .sha256 sidecar files + a combined SHA256SUMS.txt.
          : > SHA256SUMS.txt
          for f in *; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$sha" "$f" >> SHA256SUMS.txt
            printf '%s  %s\n' "$sha" "$f" > "$f.sha256"
          done

          echo "Computed checksums:"
          cat SHA256SUMS.txt

          gh release upload "$TAG" SHA256SUMS.txt *.sha256 \
            --repo "${{ github.repository }}" --clobber
