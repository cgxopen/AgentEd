name: Release

# Ceilings (#47). Same shape and same reasoning as `ci.yml`, which carries the
# argument in full: every network or compile step gets its own
# `timeout-minutes`, every job a backstop above a fully cold healthy run, and
# queue time is covered by none of them.
#
# The numbers were first transcribed from a job of the same shape -
# `nightly.yml` builds Windows with no cargo cache, exactly as this does, and
# its Windows job took 708 seconds on run 34037705792. Three tags have since
# been built here, and measured against them:
#
#   tag               run          build-and-draft  tauri-action step  curate-assets
#   v0.2.0-preview.1  36012215008  482 s            436 s              17 s
#   v0.2.0-preview.2  36692366477  662 s            603 s              20 s
#   v0.2.0-preview.3  37479884948  589 s            510 s              22 s
#
# The widest, 662 s for the job and 603 s for the step, is under a quarter of
# the 60 and the 45 minutes below. The ceilings stay as they are: a release is
# built cold every time, and a timeout costs a whole rerun of it, so the
# margin is what they are for.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-draft:
    strategy:
      fail-fast: false
      # A release builds Windows and macOS. Linux is built on nightly only
      # until it turns user-facing, because a release hands a user a product
      # and REQUIREMENTS section 7 says this one is not that yet (#550).
      #
      # macOS is Apple Silicon alone, ad-hoc signed over the whole bundle, by
      # owner decision on #538, whose step zero measured it on nightly runs:
      # - macos-latest is Apple Silicon and with no --target builds aarch64
      #   only, a 3.5 MB .dmg, the class of the Windows installer, in about
      #   three minutes. Intel and universal builds were measured and left
      #   out: the Macs the owner tests on are Apple Silicon.
      # - With no signing identity only the binary is signed, by the linker,
      #   and the bundle is not sealed. APPLE_SIGNING_IDENTITY set to a hyphen
      #   signs the whole bundle ad hoc and seals its resources, with no
      #   certificate, at a size within 0.6 percent.
      # - Ad hoc is not notarized: Gatekeeper is expected to ask the user to
      #   allow the app once, in Privacy and Security. Read, not yet seen;
      #   the owner meets it first on the v0.2.0-preview.4 test.
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: ''
          - platform: macos-latest
            args: ''
            target: ''
            signing: '-'

    runs-on: ${{ matrix.platform }}
    # Above a fully cold healthy run by a wide margin: the same job in
    # `nightly.yml`, which also builds with no cargo cache, took 708 seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable branch, 2026-10-01
        timeout-minutes: 10
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        # Guarded on a platform the matrix no longer carries (#227 left the
        # step so Linux returns as one matrix line). A ceiling on a step that
        # does not run costs nothing, and the step is ready when it does.
        #
        # The ceiling that catches a stall is the per-attempt `timeout`, not
        # the step's: apt has legitimately taken 19m 44s in `ci.yml` and
        # succeeded, so a single tight ceiling would clip a passing run. The
        # loop below is copied from `ci.yml` rather than rewritten, so all
        # three workflows say the same thing.
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 16
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} stalled or failed."
            sleep 5
          done
          echo "::error::apt did not complete within its budget after 2 attempts."
          exit 1

      - run: npm ci
        timeout-minutes: 10

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        # The action runs the frontend build and the Rust build and then
        # uploads the assets, so this is the compile step and the widest
        # ceiling in the file. 45, as the same build carries in
        # `nightly.yml`; the upload it adds is a few megabytes.
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit this release is of, passed explicitly (#41). The action
          # runs the frontend build internally, and `vite.config.ts` no longer
          # falls back to `GITHUB_SHA` — so without this a released installer
          # would report `local development build (not from CI)` under About,
          # which is visibly wrong to a user rather than quietly wrong. On a
          # tag push `github.sha` is the tagged commit, which is the commit
          # anyone means.
          #
          # **That this `env:` reaches the build the action starts was
          # measured on v0.2.0-preview.3** (run 37479884948, the first tag
          # built through tauri-action 1.0.0): its installer, checked by the
          # owner on Windows on 2026-10-06, reads Build eb0527e under About.
          # Only a tag runs this file, so the contract assertion in
          # ci.test.ts guards the wiring between releases.
          AGENTED_BUILD_COMMIT: ${{ github.sha }}
          # The ad-hoc signature over the whole macOS bundle (#538): the
          # macOS matrix line sets a hyphen. A line without the field leaves
          # the variable empty, and the Windows build reads no APPLE_ variable.
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentEd ${{ github.ref_name }}'
          releaseBody: |
            ## What's new

            <!-- Edit this section manually before publishing.
                 Highlight 3-5 user-facing changes. Keep it scannable.
                 Use GitHub's "Auto-generate release notes" button to append
                 the commit/PR list automatically, then trim to essentials. -->

            _Edit this section before publishing._

            ## Download

            | Platform | Installer |
            |---|---|
            | Windows | the `_x64-setup.exe` file in the assets below |
            | macOS (Apple Silicon) | the `_aarch64.dmg` file in the assets below; see First launch on macOS |

            First time? Most users want the installer for their OS above.

            ## First launch on macOS

            <!-- Write before publishing, from the first-launch steps of #538
                 as the owner confirmed them on this build. -->

            _Edit this section before publishing._

            <details>
            <summary><b>For developers - technical details</b></summary>

            ### Verify checksums
            Each asset has a `.sha256` sidecar; the combined `SHA256SUMS.txt`
            lists all hashes in one file. Verify after download:
            - PowerShell: `Get-FileHash AgentEd_*.exe -Algorithm SHA256`
            - macOS Terminal: `shasum -a 256 AgentEd_*.dmg`

            ### Build from source
            See `README.md` for build instructions.

            ### Changes in this release
            Click "Auto-generate release notes" in the edit view to append PR/commit list.

            </details>
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── The macOS bundle a user downloads, checked on the runner (#555) ──
      #
      # A signature can break with the build, the tests and the upload all
      # green: a packaging step that changes a signed file after signing
      # leaves a bundle Apple Silicon refuses to start. So the .dmg the step
      # above built and uploaded is opened the way a user opens it: mounted
      # read-only, AgentEd.app copied out of it, its signature verified over
      # the whole bundle and found ad hoc as the matrix line sets it, then the
      # copy started and found still running.
      #
      # What these steps do not prove: Gatekeeper and the first-launch prompt.
      # A file built on the runner carries no quarantine attribute, so macOS
      # never asks about it here; that stays the owner test on a Mac.
      #
      # A failure turns this job red, and curate-assets, which needs it, does
      # not run: the draft is left with the installers and without
      # SHA256SUMS.txt, which is what the owner sees before publishing.
      - name: 'macOS: copy AgentEd.app out of the .dmg, as a user would'
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg, found ${#images[@]}."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/copy"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "${images[0]}"
          ditto "$RUNNER_TEMP/dmg/AgentEd.app" "$RUNNER_TEMP/copy/AgentEd.app"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: 'macOS: the signature of the copy verifies, and is ad hoc'
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/copy/AgentEd.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details=$(codesign --display --verbose=2 "$app" 2>&1)
          echo "$details"
          if ! grep -qx 'Signature=adhoc' <<< "$details"; then
            echo "::error::The bundle is not signed ad hoc, as the matrix line sets it."
            exit 1
          fi

      - name: 'macOS: the copy starts and is still running after 10 seconds'
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/copy/AgentEd.app"
          open -n "$app"
          sleep 10
          if ! pgrep -f "$app/Contents/MacOS/" > /dev/null; then
            echo "::error::AgentEd was not running 10 seconds after it was started."
            exit 1
          fi
          # Nothing is unsaved, so the quit gate of #539 lets it go.
          osascript -e 'quit app "AgentEd"' || true
          for _ in $(seq 1 20); do
            pgrep -f "$app/Contents/MacOS/" > /dev/null || exit 0
            sleep 1
          done
          pkill -f "$app/Contents/MacOS/" || true

  curate-assets:
    needs: build-and-draft
    # Pinned rather than ubuntu-latest (#591): that label moves to Ubuntu 26
    # from 2026-10-19, and a job would change image with nothing changed here.
    # Moving to Ubuntu 26 is its own change, made on purpose, with the apt
    # step of the rust job measured on that image first.
    runs-on: ubuntu-24.04
    # Its work is a handful of API calls and a few megabytes of download, so
    # this is a backstop rather than a budget - the same relation to its steps
    # that every job ceiling in `ci.yml` has to its own.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Hide intermediate bundles and redundant installers
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Wait for all matrix builds to finish uploading
          sleep 10

          echo "Current assets on $TAG:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name'

          # Delete .tar.gz app bundles (intermediate, not for end users)
          for asset in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | grep -E '\.app\.tar\.gz$' || true); do
            echo "Removing intermediate bundle: $asset"
            gh release delete-asset "$TAG" "$asset" --yes --repo "${{ github.repository }}" || true
          done

          # Delete .msi (redundant with -setup.exe for Windows users)
          for asset in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | grep -E '\.msi$' || true); do
            echo "Removing redundant installer: $asset"
            gh release delete-asset "$TAG" "$asset" --yes --repo "${{ github.repository }}" || true
          done

          echo "Assets after curation:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name'

      - name: Generate SHA-256 checksums
        # Downloads every release asset before hashing it, so it is
        # network-bound and gets its own ceiling rather than the job's.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _release_assets
          cd _release_assets

          # Download every curated asset so we can hash it locally.
          mapfile -t assets < <(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            echo "Downloading $asset"
            gh release download "$TAG" --pattern "$asset" \
              --repo "${{ github.repository }}" --clobber
          done

          # Per-asset .sha256 sidecar files + a combined SHA256SUMS.txt.
          : > SHA256SUMS.txt
          for f in *; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$sha" "$f" >> SHA256SUMS.txt
            printf '%s  %s\n' "$sha" "$f" > "$f.sha256"
          done

          echo "Computed checksums:"
          cat SHA256SUMS.txt

          gh release upload "$TAG" SHA256SUMS.txt *.sha256 \
            --repo "${{ github.repository }}" --clobber
